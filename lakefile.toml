name = "l20261018ch34"
defaultTargets = ["TauCeti", "L20261018", "comparator"]

# mathlib is fetched from GitHub at a pinned commit.  Prebuilt oleans are available:
#     lake exe cache get
# If that commit is already built on your machine, replace the two lines below by
#     path = "/path/to/mathlib4"
# and `lake build` then works fully offline.
[[require]]
name = "mathlib"
path = "/home/wuzhengyao/mathlib4"

# The TauCeti modules used by this development are vendored under `TauCeti/`
# (Apache-2.0, see TauCeti/NOTICE).  Nothing else has to be installed.
#
# NOTE on `globs`: `TauCeti` has no root module (`TauCeti.lean` does not exist), so its
# bare name must NOT be listed -- it would point at that nonexistent root and `lake build`
# would fail with "no such file or directory".
[[lean_lib]]
name = "TauCeti"
globs = ["TauCeti.+"]

# The development: one namespace, one module per proof step, organised by the paper's
# chapters under `L20261018/`.  The bare `"L20261018"` glob IS listed here, because the
# root module `L20261018.lean` exists: without it `lake build` would not build the root,
# and every `import L20261018` (the comparators do exactly that) would fail with
# "object file '.../L20261018.olean' does not exist".
[[lean_lib]]
name = "L20261018"
globs = ["L20261018", "L20261018.+"]

# Comparator inputs: comparator/{ch3,ch3u,ch4u}/{Challenge,Solution,config.json}.
#   ch3   chapter 3, 14 theorems (the general algebraic layer included)
#   ch3u  chapter 3, 8 theorems, unconditional at the paper's hypothesis level
#   ch4u  chapter 4, 7 theorems, unconditional (`d` is constructed, not assumed)
[[lean_lib]]
name = "comparator"
globs = ["comparator.+"]
